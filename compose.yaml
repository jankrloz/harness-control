services:
  daemon:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4318:4318"
    environment:
      HARNESS_CONTROL_PORT: "4318"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4318/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    develop:
      watch:
        - action: sync+restart
          path: packages
          target: /app/packages
